<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f4ff;--card:#fff;--text:#2a2d3a;--text2:#6b7280;--text3:#9ca3af;
  --pri:#5b8def;--pri-hover:#4a7de0;--grn:#34c759;--org:#ff9f0a;
  --border:#e8ecf4;--sh:0 8px 30px rgba(20,30,60,.08);
  --radius:16px;
}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#e8f0fe 0%,#f3e8fe 50%,#ffe5f1 100%);
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
.container{width:100%;max-width:420px;margin:0 auto;padding:20px;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:var(--radius);padding:32px 28px;box-shadow:var(--sh);border:1px solid var(--border);width:100%}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{font-size:48px;display:block;margin-bottom:8px}
.logo-title{font-size:22px;font-weight:700;color:var(--text)}
.logo-sub{font-size:13px;color:var(--text2);margin-top:4px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:500}
.form-group input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:15px;color:var(--text);font-family:inherit;transition:border-color .2s;background:#fafbfd}
.form-group input:focus{outline:none;border-color:var(--pri);background:#fff}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:8px}
.btn-primary{background:var(--pri);color:#fff}
.btn-primary:hover{background:var(--pri-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(91,141,239,.3)}
.btn-primary:active{transform:none}
.btn-outline{background:transparent;border:2px solid var(--border);color:var(--text2);margin-top:12px}
.btn-outline:hover{border-color:var(--pri);color:var(--pri)}
.switch-text{text-align:center;margin-top:16px;font-size:13px;color:var(--text2)}
.switch-text a{color:var(--pri);cursor:pointer;font-weight:600;text-decoration:none}
.switch-text a:hover{text-decoration:underline}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
.alert-error{background:#ffe8e6;color:#d32f2f;border:1px solid #ffcdd2;display:block}
.alert-success{background:#e3f7e9;color:#2e7d32;border:1px solid #c8e6c9;display:block}
.student-fields{display:none}
.student-fields.show{display:block}
.grade-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grade-row select{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:15px;color:var(--text);font-family:inherit;background:#fafbfd;cursor:pointer}
.grade-row select:focus{outline:none;border-color:var(--pri);background:#fff}
.btn .spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.loading .btn-text{display:none}
.btn.loading .spinner{display:block}
.btn.loading{cursor:wait}
@media(max-width:480px){.card{padding:26px 20px}.logo-icon{font-size:36px}.logo-title{font-size:20px}.form-group input{padding:13px 14px;font-size:16px}.btn{padding:14px;font-size:16px}.sync-panel{padding:20px;max-width:100%}.container{padding:14px;align-items:flex-start}.card{margin-top:10px}.grade-row{grid-template-columns:1fr 1fr}}
#appFrame{width:100%;height:100vh;border:none;display:none;background:#f0f4ff}
/* ===== 忘记密码弹窗（复用弹窗样式）===== */
.sync-mask{position:fixed;inset:0;background:rgba(20,30,60,.45);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
.sync-panel{background:#fff;border-radius:var(--radius);box-shadow:var(--sh);width:100%;max-width:400px;padding:24px;max-height:86vh;overflow:auto}
.sync-head{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px}
.sync-close{cursor:pointer;font-size:18px;color:var(--text3);padding:0 4px}
.sync-close:hover{color:var(--text)}
.sync-status{font-size:14px;margin-bottom:14px}
.sync-status .ok{color:#2e7d32}
.sync-status .off{color:#b26a00}
.sync-tip{margin-top:16px;font-size:12px;line-height:1.7;color:var(--text3);background:#f8fafd;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
</style>

<body>

    <div class="logo">

      <div class="logo-title">智慧学习平台</div>

      <div class="form-group"><label>显示名称</label><input type="text" id="regDisplayName" placeholder="你的名字（如：张小明）" required></div>

      <div class="student-fields show" id="studentFields">
        <div class="form-group"><label>学段与年级（用于匹配学习内容）</label>

          </div>
        </div>

      <button type="button" class="btn btn-primary" id="regBtn"><span class="btn-text">注 册</span><span class="spinner"></span></button>

    <div class="switch-text"><span id="switchLabel">还没有账号？</span><a onclick="toggleMode()" id="switchLink">立即注册</a></div>
    <div class="switch-text" style="margin-top:6px"><a onclick="openForgotModal()" style="color:var(--text3)">忘记密码？</a></div>
  </div>
</div>

<!-- 忘记密码弹窗 -->
<div class="sync-mask" id="forgotMask" onclick="if(event.target===this)closeForgotModal()">
  <div class="sync-panel">
    <div class="sync-head"><span>🔑 忘记密码</span><span class="sync-close" onclick="closeForgotModal()">✕</span></div>
    <div class="sync-status" id="forgotStatus"></div>
    <div id="forgotBody"></div>
    <div class="sync-tip" id="forgotTip"></div>
  </div>
</div>

<iframe id="appFrame" title="应用"></iframe>

<script>
// ===== 用户库（与 learning.html / admin.html 共用 localStorage sw_users）=====
const USER_DB_KEY = 'sw_users';
const SESSION_KEY = 'sw_session';

function loadUsers(){ try{ return JSON.parse(localStorage.getItem(USER_DB_KEY))||{}; }catch(e){ return {}; } }
function saveUsers(u){ localStorage.setItem(USER_DB_KEY, JSON.stringify(u)); }
// 会话统一走安全模块（带过期时间 + 完整性签名）
function saveSession(s){ return SWAuth.setSession(s); }
function getSession(){ return SWAuth.getSession(); }
function clearSession(){ SWAuth.clearSession(); }

// 旧版弱哈希（仅保留兼容名；新密码一律用 SWAuth.hash 的 PBKDF2）
function simpleHash(str){ return SWAuth.legacyHash(str); }

// 默认账号初始化：不再预置任何账号（旧版会写入 admin123/1234 等已知口令的管理员与学生账号，
// 任何人只要打开页面就能拿到一个"管理员账号"，属于严重漏洞）。账号数据一律以云端同步为准。
function initDefaultUsers(){
  var users=loadUsers();
  // 清理历史遗留的本地重置验证码（旧版把验证码存在本地，可被任意改写 → 任意账号被重置）
  try{
    var rm=[];
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf('sw_reset_')===0) rm.push(k); }
    rm.forEach(function(k){ localStorage.removeItem(k); });
  }catch(e){}
  // 清除用户库里不该存在的敏感字段（历史重置验证码）
  if(SWAuth.stripSensitive(users)) saveUsers(users);
  if(!localStorage.getItem('sw_families')) localStorage.setItem('sw_families', JSON.stringify({}));
  // 邀请码：升级为 6 位（旧版 4 位易被穷举）
  var code=(localStorage.getItem('sw_invite_code')||'').trim();
  if(!/^\d{6}$/.test(code)) localStorage.setItem('sw_invite_code', String(Math.floor(100000+Math.random()*900000)));
  // 每次加载做一次本地滚动备份（保留最近 3 份）
  try{ SWAuth.backup(); }catch(e){}
  return Object.keys(users).length;
}

var isRegisterMode=false;
function toggleMode(){
  isRegisterMode=!isRegisterMode;
  document.getElementById('loginForm').style.display=isRegisterMode?'none':'block';
  document.getElementById('registerForm').style.display=isRegisterMode?'block':'none';
  document.getElementById('switchLabel').textContent=isRegisterMode?'已有账号？':'还没有账号？';
  document.getElementById('switchLink').textContent=isRegisterMode?'返回登录':'立即注册';
  hideAlert();
  document.getElementById('regUsername').value='';
  document.getElementById('regDisplayName').value='';
  document.getElementById('regPassword').value='';
  document.getElementById('regPassword2').value='';
  document.getElementById('regInvite').value='';
}
function showAlert(m,t){ var b=document.getElementById('alertBox'); b.textContent=m; b.className='alert alert-'+t; }
function hideAlert(){ var b=document.getElementById('alertBox'); b.className='alert'; b.textContent=''; }
function setLoading(id,on){ document.getElementById(id).classList.toggle('loading',on); }

// ===== 忘记密码（验证码重置）=====
// 验证码规则：学生/家长由管理员在管理端生成；管理员由系统生成并发至账号邮箱
function openForgotModal(){
  document.getElementById('forgotMask').style.display='flex';
  document.getElementById('forgotStatus').innerHTML='';
  document.getElementById('forgotTip').textContent='为安全起见，已关闭"自助重置密码"功能。';
  document.getElementById('forgotBody').innerHTML=
    '<div style="line-height:1.9;font-size:14px;color:var(--text2)">'+
    '🔐 <b>忘记密码怎么办？</b><br>'+
    '1. 记得旧密码：登录后在「账户设置 → 修改密码」中自行修改；<br>'+
    '2. 不记得密码：请让<b>管理员</b>登录后在「用户管理」中直接为你重设新密码；<br>'+
    '3. 管理员本人忘记密码：请用当前浏览器内的备份恢复，或联系超级管理员。'+
    '<div style="margin-top:12px;padding:10px 12px;background:#f5f7fa;border-radius:8px;font-size:12.5px;color:var(--text3)">'+
    '说明：旧版的"验证码自助重置"因验证码保存在本机可被篡改（任何人都能借此重置他人账号），已彻底移除。'+
    '</div></div>'+
    '<button type="button" class="btn btn-primary" style="margin-top:14px" onclick="closeForgotModal()">我知道了</button>';
}
function closeForgotModal(){ document.getElementById('forgotMask').style.display='none'; }
function fgLog(m,t){ var b=document.getElementById('forgotStatus'); b.innerHTML='<span class="'+(t||'off')+'">'+m+'</span>'; }
function fgSendCode(){
  // 已停用：原实现把验证码写在本地 localStorage（可被任意篡改），
  // 攻击者只需自己写入一个验证码即可重置任意账号 → 逻辑整体移除。
  fgLog('🔐 自助重置已停用，请联系管理员在「用户管理」中为你重设密码','off');
}
function fgShowResetForm(){
  fgLog('🔐 自助重置已停用，请联系管理员重设密码','off');
}
function fgReset(){
  // 双保险：即使被外部调用，也不执行任何密码写入
  fgLog('🔐 自助重置已停用','off');
  return false;
}
/* 邮件发送能力保留（账户设置里可配置 EmailJS），但"密码重置验证码"链路已整体停用：
 * 旧实现会把验证码写到 sw_users[账号].data._resetCode —— 该字段会同步到云端且云端可公开读取，
 * 等于把管理员的重置验证码挂在公网上，任何人都能据此重置管理员密码。 */
function _ejConfig(){
  try{ return JSON.parse(localStorage.getItem('sw_emailjs'))||{}; }catch(e){ return {}; }
}
function sendResetEmail(){
  // 不再生成/存储任何重置验证码
  return Promise.resolve(false);
}
function fgNeedAdmin(){ /* 预留 */ }

// ===== 路由：按角色载入对应页面（同一网址）=====
function showApp(role){
  document.getElementById('loginScreen').style.display='none';
  var frame=document.getElementById('appFrame');
  frame.src = (role==='student') ? 'learning.html' : 'admin.html';
  frame.style.display='block';
}

async function doLogin(){
  hideAlert();
  var username=document.getElementById('username').value.trim();
  var password=document.getElementById('password').value;
  if(!username||!password){ showAlert('请输入用户名和密码','error'); return; }
  // 登录限流：连续失败 5 次锁定 5 分钟（防暴力破解）
  var lock=SWAuth.lockRemain(username);
  if(lock>0){ showAlert('尝试次数过多，请 '+Math.ceil(lock/60)+' 分钟后再试','error'); return; }
  setLoading('loginBtn',true);
  try{
    var users=loadUsers();
    var user=users[username];
    var ok=false;
    if(user){ ok=await SWAuth.verify(password, user.password); }
    if(!ok){
      if(user){ SWAuth.recordFail(username); }
      // 统一提示，不泄露"用户名是否存在"（防账号枚举）
      if(!user && window.SyncHub && !window.SyncHub._firstPullDone){
        showAlert('⏳ 正在从云端同步数据，请等待几秒后重试…','error');
      }else{
        var left=SWAuth.failRemain(username);
        showAlert('用户名或密码错误'+(left>0?('，还可尝试 '+left+' 次'):''),'error');
      }
      setLoading('loginBtn',false); return;
    }
    SWAuth.clearFail(username);
    // 旧版 32 位弱哈希 → 首次成功登录时静默升级为 PBKDF2 强哈希
    if(SWAuth.isLegacy(user.password)){
      try{ user.password=await SWAuth.hash(password); saveUsers(users); }catch(e){}
    }
    saveSession({username:username,displayName:user.displayName,role:user.role,stage:user.stage||'',grade:user.grade||'',semester:user.semester||'上'});
    // 默认弱口令（1234/admin123 等）→ 强制修改后才可用
    var weak=SWAuth.weakDefaultOf(user.password, username);
    setLoading('loginBtn',false);
    showApp(user.role);
    if(weak){
      setTimeout(function(){ forceChangePassword(weak); }, 600);
    }
  }catch(e){ showAlert('登录失败，请刷新重试','error'); setLoading('loginBtn',false); }
}

// 强制修改弱口令（管理员/家长账号仍使用默认口令时）
function forceChangePassword(weakPwd){
  try{
    var mask=document.createElement('div');
    mask.id='forcePwdMask';
    mask.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px';
    mask.innerHTML=
      '<div style="background:#fff;border-radius:16px;max-width:420px;width:100%;padding:22px">'+
      '<h3 style="margin:0 0 6px;font-size:17px">🔐 请修改默认密码</h3>'+
      '<p style="color:#b42318;font-size:13px;line-height:1.7;margin:0 0 14px">检测到你的密码是系统默认值「'+SWAuth.esc(weakPwd)+'」，'+
      '任何人都能猜出并登录你的账号。为保护数据安全，请立即设置新密码。</p>'+
      '<div style="margin-bottom:10px"><input id="fpOld" type="password" placeholder="当前密码" style="width:100%;padding:11px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px"></div>'+
      '<div style="margin-bottom:10px"><input id="fpNew" type="password" placeholder="新密码（≥8位，含字母和数字）" style="width:100%;padding:11px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px"></div>'+
      '<div style="margin-bottom:14px"><input id="fpNew2" type="password" placeholder="确认新密码" style="width:100%;padding:11px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px"></div>'+
      '<div id="fpMsg" style="font-size:12.5px;color:#b42318;min-height:18px;margin-bottom:8px"></div>'+
      '<button id="fpBtn" style="width:100%;padding:12px;border:0;border-radius:10px;background:#5b8def;color:#fff;font-size:15px;font-weight:600">设置新密码</button>'+
      '</div>';
    document.body.appendChild(mask);
    document.getElementById('fpBtn').onclick=async function(){
      var msg=document.getElementById('fpMsg');
      var o=document.getElementById('fpOld').value, n=document.getElementById('fpNew').value, n2=document.getElementById('fpNew2').value;
      var users=loadUsers(); var uname=(getSession()||{}).username;
      if(!uname||!users[uname]){ msg.textContent='会话异常，请重新登录'; return; }
      if(!(await SWAuth.verify(o, users[uname].password))){ msg.textContent='当前密码不正确'; return; }
      var bad=SWAuth.checkStrength(n);
      if(bad){ msg.textContent=bad; return; }
      if(n!==n2){ msg.textContent='两次新密码不一致'; return; }
      users[uname].password=await SWAuth.hash(n);
      saveUsers(users);
      mask.remove();
      if(window.top&&window.top!==window){ try{ window.top.location.reload(); }catch(e){} }
    };
  }catch(e){}
}

async function doRegister(){
  hideAlert();
  var username=document.getElementById('regUsername').value.trim();
  var displayName=document.getElementById('regDisplayName').value.trim();
  var password=document.getElementById('regPassword').value;
  var password2=document.getElementById('regPassword2').value;
  if(!username||!displayName||!password||!password2){ showAlert('请填写所有字段','error'); return; }
  if(username.length<2||username.length>20){ showAlert('用户名需2-20个字符','error'); return; }
  if(!/^[一-龥a-zA-Z0-9_]+$/.test(username)){ showAlert('用户名只能含中文、英文、数字、下划线','error'); return; }
  var bad=SWAuth.checkStrength(password);
  if(bad){ showAlert(bad,'error'); return; }
  if(password!==password2){ showAlert('两次密码不一致','error'); return; }
  var invInput=(document.getElementById('regInvite').value||'').trim();
  var realCode=(localStorage.getItem('sw_invite_code')||'').trim();
  if(!invInput){ showAlert('请填写注册邀请码','error'); return; }
  // 邀请码校验（不再提示需要几位，避免帮助攻击者）
  if(invInput!==realCode){ showAlert('邀请码错误，请向管理员获取正确的邀请码','error'); return; }
  var users=loadUsers();
  if(users[username]){ showAlert('该用户名已被使用','error'); return; }
  setLoading('regBtn',true);
  try{
    var user={password:await SWAuth.hash(password),role:'student',displayName:displayName};
    user.stage=document.getElementById('regStage').value;
    user.grade=document.getElementById('regGrade').value;
    user.semester='上';
    users[username]=user; saveUsers(users);
    saveSession({username:username,displayName:displayName,role:'student',stage:user.stage||'',grade:user.grade||'',semester:'上'});
    setLoading('regBtn',false);
    showApp('student');
  }catch(e){ showAlert('注册失败，请刷新重试','error'); setLoading('regBtn',false); }
}

document.addEventListener('DOMContentLoaded', function(){
  try{
    initDefaultUsers();
    document.getElementById('loginBtn').addEventListener('click', function(e){ e.preventDefault(); doLogin(); });
    document.getElementById('regBtn').addEventListener('click', function(e){ e.preventDefault(); doRegister(); });
    document.getElementById('password').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); doLogin(); } });
    document.getElementById('regPassword2').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); doRegister(); } });
    var regStage=document.getElementById('regStage');
    regStage.addEventListener('change', function(){
      var stage=this.value;
      var gradeMap={'小学':['一年级','二年级','三年级','四年级','五年级','六年级'],'初中':['七年级','八年级','九年级'],'高中':['高一','高二','高三']};
      var grades=gradeMap[stage]||[];
      document.getElementById('regGrade').innerHTML=grades.map(function(g){ return '<option value="'+g+'">'+g+'</option>'; }).join('');
    });
    var s=getSession();
    // 自动登录：角色以用户库为准（改 session 无法提权）
    var au=SWAuth.authUser();
    if(s && au && au.role){ showApp(au.role); }
  }catch(e){ console.error(e); }
});
</script>
</body>
</html>
